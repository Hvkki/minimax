[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giggsdance"
version = "0.1.0"
description = "60 fps, high-resolution rendering pipeline on top of MiniMax H3"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
modal = ["modal>=0.64.0"]
upscale = ["spandrel==0.4.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["giggsdance", "giggsdance.stages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
